substitutions:
  _GEMINI_API_KEY: ''   # passed at submit time via --substitutions

steps:
  # ─── BACKEND ────────────────────────────────────────────────────────────────

  - name: 'gcr.io/cloud-builders/docker'
    id: build-backend
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/votesmart-backend:latest
      - ./backend

  - name: 'gcr.io/cloud-builders/docker'
    id: push-backend
    waitFor: ['build-backend']
    args:
      - push
      - gcr.io/$PROJECT_ID/votesmart-backend:latest

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: deploy-backend
    waitFor: ['push-backend']
    entrypoint: gcloud
    args:
      - run
      - deploy
      - votesmart-backend
      - --image=gcr.io/$PROJECT_ID/votesmart-backend:latest
      - --platform=managed
      - --region=asia-south1
      - --allow-unauthenticated
      - --memory=512Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=5
      - --set-env-vars=GEMINI_API_KEY=${_GEMINI_API_KEY}

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: get-backend-url
    waitFor: ['deploy-backend']
    entrypoint: bash
    args:
      - -c
      - |
        URL=$(gcloud run services describe votesmart-backend \
          --platform=managed \
          --region=asia-south1 \
          --format='value(status.url)')
        echo "Backend URL: $$URL"
        echo "$$URL" > /workspace/backend_url.txt

  # ─── FRONTEND ───────────────────────────────────────────────────────────────

  - name: 'gcr.io/cloud-builders/docker'
    id: build-frontend
    waitFor: ['get-backend-url']
    entrypoint: bash
    args:
      - -c
      - |
        BACKEND_URL=$(cat /workspace/backend_url.txt)
        echo "Building frontend with VITE_API_URL=$$BACKEND_URL"
        docker build \
          --build-arg VITE_API_URL=$$BACKEND_URL \
          -t gcr.io/$PROJECT_ID/votesmart-frontend:latest \
          ./frontend

  - name: 'gcr.io/cloud-builders/docker'
    id: push-frontend
    waitFor: ['build-frontend']
    args:
      - push
      - gcr.io/$PROJECT_ID/votesmart-frontend:latest

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: deploy-frontend
    waitFor: ['push-frontend']
    entrypoint: gcloud
    args:
      - run
      - deploy
      - votesmart-frontend
      - --image=gcr.io/$PROJECT_ID/votesmart-frontend:latest
      - --platform=managed
      - --region=asia-south1
      - --allow-unauthenticated
      - --memory=256Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=3

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: print-urls
    waitFor: ['deploy-frontend']
    entrypoint: bash
    args:
      - -c
      - |
        BACKEND=$(gcloud run services describe votesmart-backend --platform=managed --region=asia-south1 --format='value(status.url)')
        FRONTEND=$(gcloud run services describe votesmart-frontend --platform=managed --region=asia-south1 --format='value(status.url)')
        echo "======================================"
        echo "  VoteSmart AI Deployed!"
        echo "  Frontend : $$FRONTEND"
        echo "  Backend  : $$BACKEND/health"
        echo "======================================"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_MEDIUM
